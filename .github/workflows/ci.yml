name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Allure's CLI (allure-commandline) is a Java application.
      - name: Set up Java (for Allure report)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check (Biome)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests with coverage + JUnit results
        run: npm run test:ci

      - name: Generate Allure report
        if: always()
        run: npm run report

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
